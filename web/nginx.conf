# Autor: Matheus C. Pestana
# :80 = painel; :8089 = tar1090/graphs1090 atrás de auth_request → /api/auth/check

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker, relido a cada 10 s: quando a API é recriada ela pode ganhar outro IP, e um
  # proxy_pass com nome fixo continuaria batendo no IP antigo (502 até reiniciar o web)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri /index.html;
  }
}

# tar1090 + graphs1090: cookie do login em :3090 vale aqui (mesmo host, outra porta)
server {
  listen 8089;
  server_name _;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  set $uf_upstream http://ultrafeeder:80;

  location = /_auth {
    internal;
    proxy_pass $api_upstream/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
  }

  location / {
    auth_request /_auth;
    proxy_pass $uf_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
}
