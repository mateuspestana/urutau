<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Urutau — estação RTL-SDR caseira: aviões, navios, rádio, sondas e satélites" />
    <title>Urutau</title>
    <script>
      // aplica o tema antes do primeiro desenho (mesma regra do App.tsx: ?theme= > salvo > claro)
      try {
        var q = new URLSearchParams(location.search).get('theme')
        var t = q || localStorage.getItem('rtlsdr-theme-v2')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
